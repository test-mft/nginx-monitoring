name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  helm-validate:
    name: 'Validate Helm Chart'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Run helm lint
        run: helm lint ./helm/nginx-monitoring --strict

      - name: Run helm template (render check)
        run: helm template nginx-monitoring ./helm/nginx-monitoring > /dev/null
