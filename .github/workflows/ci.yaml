name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  helm-validate:
    name: 'Validate Helm Chart'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Run helm lint
        run: helm lint ./helm/nginx-monitoring --strict

      - name: Run helm template (render check)
        run: helm template nginx-monitoring ./helm/nginx-monitoring > /dev/null

  build-and-push:
    name: 'Build and Push Docker Image'
    needs: helm-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/day1-app
          file: ./docker/day1-app/Dockerfile.single 
          push: true
          tags: ghcr.io/${{ github.repository }}/myapp:${{ github.sha }}
