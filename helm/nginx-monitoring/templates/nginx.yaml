# nginx-all.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-status-config
data:
  stub_status.conf: |
    server {
      listen 8080;
      location /stub_status {
        stub_status on;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/stub_status.conf
          subPath: stub_status.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-status-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30001
  - name: status
    port: 8080
    targetPort: 8080
    nodePort: 30002
