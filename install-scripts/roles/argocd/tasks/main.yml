- name: 创建argocd命名空间
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present

- name: 安装 ArgoCD
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    namespace: "{{ argocd_namespace }}"

- name: 等待 argocd-server 就绪
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_status
  until: argocd_status.resources[0].status.readyReplicas | default(0) > 0
  retries: 30
  delay: 10

- name: 创建 Application
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../deploy/argocd-app.yaml"
