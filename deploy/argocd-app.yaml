apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/你的用户名/k8s-observability-lab.git
    targetRevision: main
    path: helm/nginx-monitoring
    helm:
      valueFiles:
        - ../../deploy/nginx-monitoring/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
